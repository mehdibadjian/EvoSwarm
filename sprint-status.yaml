tracking_system: file-system
story_location: docs/stories

development_status:
  # Epics
  epic-0: in-progress
  epic-1: in-progress
  epic-2: done
  epic-3: backlog
  epic-4: backlog
  epic-5: backlog

  # Epic 0: The Crucible (Sandbox & Isolation)
  e0-1-sandbox-runner-interface: done
  e0-2-host-self-check: review  # SEAM: decide() + live unshare probe verified; cgroup-delegation/linger probes need delegated cgroups + systemd user bus (roadmap §6)
  e0-3-apparmor-profile-for-bwrap: done
  e0-4-resource-limits: backlog
  e0-5-python-stack: done
  e0-6-csharp-stack: backlog
  e0-7-tamper-proof-tests: done
  e0-8-red-team-suite: review  # SEAM: bwrap escape-denial subset asserted (egress/DNS/write/pid1 + seccomp syscalls since e2-7); shadow-read/cgroup still deferred (uid 0, no e0-4) (roadmap §7)
  e0-9-limit-calibration: review  # SEAM: pure stats/profile math verified; live 100-run measurement needs csharp/dotnet (absent) (roadmap §5)

  # Epic 1: Evolve CLI and Fitness
  e1-1-start-a-job-from-the-cli: done
  e1-2-model-roles-in-config: done
  e1-3-seed-the-first-generation: review  # SEAM: verified against stub ModelClient/MemorySeeder; live-gate half needs provider keys (roadmap §5)
  e1-4-mutation-with-error-feedback: review  # SEAM: verified against stub ModelClient/LineageSink; live-gate half needs provider keys (roadmap §5)
  e1-5-crossover-of-two-parents: review  # SEAM: verified against stub ModelClient/LineageSink; live-gate half needs provider keys (roadmap §5)
  e1-6-hard-gates: done
  e1-7-weighted-score: done
  e1-8-held-out-tests: done
  e1-9-adversary-tests: review  # SEAM: verified against stub ModelClient/SandboxBackend; live-gate half needs provider keys + real compilation (roadmap §5)
  e1-10-budget-enforcement: done
  e1-11-patch-and-report: done
  e1-12-resume-after-crash: done
  e1-13-benchmark-suite: review  # SEAM: fixture integrity (30 tasks, >=10 python/>=10 csharp), structural fairness (shared TOKEN_CAP=500k/model-roles/sandbox/held-out bound by identity into both runners), enforce_cap boundary, and solve-rate delta + inclusive >=15.0 gate math all verified deterministically; live single-shot/EvoSwarm runs need LLM provider keys and C# fixture builds need the dotnet SDK (roadmap §6), so run() raises NotImplementedError and best live gate is deferred

  # Epic 2: System 1 Memory and Replay
  e2-1-content-addressed-blob-store: done
  e2-2-lineage-written-to-falkordb: done
  e2-3-repo-and-toolchain-fingerprints: done
  e2-4-verified-replay: done
  e2-5-seeding-from-similar-winners: done
  e2-6-approve-candidate-tests: done
  e2-7-seccomp-filter: done
  e2-8-lineage-cli: done

  # Epic 3: Claude Code Integration (MCP)
  e3-1-evolve-tool: review  # SEAM: JSON-RPC layer + evolve schema/tool verified in-process (durable Queued ticket, test_command + path-escape rejection); live Claude Code stdio end-to-end needs daemon + LLM keys (roadmap §7)
  e3-2-job-status-tool: review  # SEAM: state+generation read from the ledger (max_generation), not-found/id-required paths verified in-process; best_score/spend_usd/eta_seconds returned as explicit null because the engine keeps them in-memory and does not persist a per-job progress row, and live Claude Code e2e needs daemon + LLM keys (roadmap §7)
  e3-3-job-result-tool: review  # SEAM: branch/patch_path/report_path + *_exists wired to e1-11 artifacts::emit layout and verified against the real filesystem (canonicalised root), plus partial=true mid-run peek; score/tests_passed returned as explicit null because the engine renders them into the markdown report only and never persists per-job data, and AC3 (apply patch + tests pass) needs daemon + LLM keys (roadmap §7)
  e3-4-cancel-job-tool: review  # SEAM: durable Queued/Running -> Cancelled transition verified against the real ledger (read_status), idempotent re-cancel returns the same result with no error, and a different terminal state (completed/failed/budget_exhausted) is refused without mutating the job; best_verified_candidate returned as explicit null because the engine computes it in-memory (select_verified_winner) and only persists opaque population JSON, and AC1 (no new model calls after in-flight) needs daemon + LLM keys (roadmap §7)
  e3-5-context-guard: done
  e3-6-setup-guide: done

  # Epic 4: Optional Streaming Gateway
  e4-1-transparent-pass-through: review # SEAM: verified against stub upstream (byte-fidelity, error propagation, structural abort); live-provider pass-through needs LLM keys (roadmap §7)
  e4-2-usage-logging: review # SEAM: usage tee + CLI verified against stub SSE frames and local sqlite; live-provider accounting needs LLM keys (roadmap §7)
  e4-3-exemplar-injection: done
  e4-4-injection-opt-out: review # SEAM: header/config bypass + 0-call fast path verified against stub upstream; injector is a test stub because e4-3 (FalkorDB exemplars) is blocked on e2-5 (roadmap §5)
  e4-5-latency-budget-in-ci: review # SEAM: 20-stream TTFT budget measured loopback-vs-loopback (added p95 ~2ms <= 50ms); IDE-vs-provider budget needs live provider (roadmap §7)

  # Epic 5: MAP-Elites and Multi-Stack Expansion
  e5-1-map-elites-grid: review  # SEAM: binning/replacement verified against in-process RecordingCellSink; FalkorDB Cell-node write needs redis-compatible FalkorDB (roadmap §5)
  e5-2-selection-mode-comparison: done
  e5-3-java-stack: review  # SEAM: pom-hash keying/cache-reuse/offline mvn cmd verified; live mvn -o test needs primed ~/.m2, 2GB cap needs e0-4 (roadmap §5)
  e5-4-c-and-cpp-stack: review  # SEAM: cmake cmd + gtest/catch2 parsers verified; live build needs gtest/catch2 libs, 1GB cap needs e0-4 (roadmap §5)
  e5-5-test-triage-page: backlog
  e5-6-archive-health-report: review  # SEAM: occupancy/heatmap verified against in-process archive; per-generation Cell-node history needs FalkorDB (roadmap §5)

