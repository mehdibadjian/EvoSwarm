[package]
name = "evoswarm-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "evoswarm"
path = "src/main.rs"

[dependencies]
evoswarm-core = { workspace = true }
evoswarm-ledger = { workspace = true }
evoswarm-gateway = { workspace = true }
evoswarm-sandbox = { workspace = true }
evoswarm-memory = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
git2 = { workspace = true }
axum = "0.8"

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
