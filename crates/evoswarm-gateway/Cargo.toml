[package]
name = "evoswarm-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
evoswarm-core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "rt-multi-thread", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
futures = "0.3"

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
sha2 = { workspace = true }
