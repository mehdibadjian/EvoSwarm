[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
arc-swap = "1"
thiserror = "2"
async-trait = "0.1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
git2 = "0.19"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "signal", "macros", "sync"] }
evoswarm-core = { path = "crates/evoswarm-core" }
evoswarm-sandbox = { path = "crates/evoswarm-sandbox" }
evoswarm-models = { path = "crates/evoswarm-models" }
evoswarm-fitness = { path = "crates/evoswarm-fitness" }
evoswarm-memory = { path = "crates/evoswarm-memory" }
evoswarm-ledger = { path = "crates/evoswarm-ledger" }
evoswarm-engine = { path = "crates/evoswarm-engine" }
